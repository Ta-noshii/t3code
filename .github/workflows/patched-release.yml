name: Patched desktop and server release

# Rebuilds each upstream T3 Code release with the fork's patch branch applied and
# publishes it here under the same version, so:
#   - the desktop app (built with this repository as its update feed) updates
#     itself onto patched builds, and
#   - servers whose service sets T3CODE_RELEASE_BASE_URL to this repository's
#     release downloads install the patched runtime from the normal "Update".
# A patch that conflicts or breaks typecheck/tests goes to the Cursor agent to reconcile
# (needs the CURSOR_API_KEY secret); if that fails too, the run fails and leaves earlier
# releases alone. FORK_CHANGES.md lists what the patches do.

on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version to patch, e.g. 0.0.43-nightly.20260922.2110 or 0.0.43. Empty builds the newest nightly.
        type: string
        default: ""
      rebuild:
        description: Replace an existing patched release of that version
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: patched-release
  cancel-in-progress: false

env:
  UPSTREAM: pingdotgg/t3code
  # Applied in order. A branch that is gone (merged and deleted) is skipped, and commits
  # upstream already contains drop out as empty cherry-picks.
  PATCH_BRANCHES: >-
    patch/edit-fork
    fix/hyprland-snapshot-flight-sizing
    fix/preview-viewport-main-zoom

jobs:
  plan:
    if: github.repository == 'Ta-noshii/t3code'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ]; then
            candidates=("${VERSION#v}")
          else
            releases=$(gh release list -R "$UPSTREAM" --limit 40 --json tagName --jq '.[].tagName')
            # Stable releases trail main and may need a rebased patch, so they are
            # built on request only.
            nightly=$(grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$' <<<"$releases" || true)
            candidates=()
            for tag in $nightly; do candidates+=("${tag#v}"); done
          fi
          versions=()
          for version in "${candidates[@]}"; do
            if [ "$REBUILD" != true ] && gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$version is already patched." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            versions+=("$version")
          done
          json=$(printf '%s\n' "${versions[@]}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "versions=$json" >> "$GITHUB_OUTPUT"
          echo "To build: $json" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    name: Patch ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ matrix.version }}
      # Public production client settings, the same values upstream builds embed.
      # Without them the app cannot sign in to T3 Connect.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - name: Check out the upstream release
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git config user.name 'T3 patched release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --filter=blob:none upstream "refs/tags/v$VERSION:refs/tags/upstream-v$VERSION"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -q --detach "upstream-v$VERSION"
          # The reconcile script and the change list live on this branch, not in the upstream tree.
          git fetch -q --filter=blob:none origin "$GITHUB_REF"
          git show "FETCH_HEAD:.github/scripts/patch-reconcile.sh" > "$RUNNER_TEMP/patch-reconcile.sh"
          git show "FETCH_HEAD:FORK_CHANGES.md" > "$RUNNER_TEMP/FORK_CHANGES.md"
          chmod +x "$RUNNER_TEMP/patch-reconcile.sh"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install Linux desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Installed before the patches too, so the agent can typecheck while it resolves them.
      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/web...

      # Conflicts go to the Cursor agent when CURSOR_API_KEY is set.
      - name: Apply the fork's patches
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          "$RUNNER_TEMP/patch-reconcile.sh" apply
          vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/web...

      # A patch can apply cleanly yet reference code upstream renamed or removed. Failures
      # go to the agent too, for up to two rounds of fixes.
      - name: Typecheck and test the patched apps
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: '"$RUNNER_TEMP/patch-reconcile.sh" check'

      - name: Align package versions to the upstream release
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build desktop AppImage
        env:
          # Makes the app's updater read this repository's releases.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$VERSION" --verbose

      - name: Build server single-executable
        env:
          # Keep in step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build and smoke-test server archive
        run: |
          set -euo pipefail
          monitor="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      # The Windows job rebuilds from this exact tree (patches plus any agent fixes) and
      # embeds the Linux CLI archive as its WSL runtime, as upstream's Windows build does.
      - name: Collect Linux assets and the patched tree
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-assets"
          handoff="$RUNNER_TEMP/handoff"
          mkdir -p "$out" "$handoff"
          cp release/*.AppImage release-cli/*.tar.gz "$out/"
          cp release/*.yml "$out/" 2>/dev/null || true
          rm -f "$out/builder-debug.yml"
          if [ -s "$RUNNER_TEMP/ai-notes.md" ]; then
            git diff "upstream-v$VERSION" HEAD > "$out/ai-reconciliation.patch"
            cp "$RUNNER_TEMP/ai-notes.md" "$handoff/"
            cat "$RUNNER_TEMP/ai-notes.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          git diff --binary "upstream-v$VERSION" HEAD > "$handoff/patched-tree.patch"
          cp release-cli/*.tar.gz "$handoff/"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.version }}
          path: ${{ runner.temp }}/linux-assets/*
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ matrix.version }}
          path: ${{ runner.temp }}/handoff/*
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [plan, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    name: Windows ${{ matrix.version }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ matrix.version }}
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - name: Check out the upstream release
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          # The patch is LF; a CRLF checkout would make it fail to apply.
          git config core.autocrlf false
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch -q --filter=blob:none upstream "refs/tags/v$VERSION:refs/tags/upstream-v$VERSION"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -q --detach "upstream-v$VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: handoff-${{ matrix.version }}
          path: handoff

      - name: Apply the patched tree from the Linux build
        run: git apply --binary handoff/patched-tree.patch

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) { exit 1 }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/web...

      - name: Align package versions to the upstream release
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # Unsigned: upstream signs with Azure Trusted Signing, which this repository lacks,
      # so Windows SmartScreen warns on first install.
      - name: Build desktop installer
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$VERSION" \
            --wsl-runtime "$GITHUB_WORKSPACE"/handoff/t3-*-linux-x64.tar.gz --verbose

      - name: Collect Windows assets
        run: |
          set -euo pipefail
          mkdir -p windows-assets
          cp release/*.exe release/*.blockmap windows-assets/
          cp release/*.yml windows-assets/
          rm -f windows-assets/builder-debug.yml

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.version }}
          path: windows-assets/*
          if-no-files-found: error
          retention-days: 3

  # Publishes once both builds finish. A failed Windows build still publishes Linux, so
  # the desktop and servers keep updating; the notes say Windows is missing.
  publish:
    needs: [plan, build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
    name: Publish ${{ matrix.version }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.version }}
          path: assets

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-${{ matrix.version }}
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: handoff-${{ matrix.version }}
          path: handoff

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          # Servers verify their archive against SHA256SUMS before installing it.
          (cd assets && sha256sum *.tar.gz > SHA256SUMS)
          tag="v$VERSION"
          if [ "$REBUILD" = true ]; then gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; fi
          # The patched tree can't be pushed as a tag: once upstream edits its workflow files,
          # the workflow token may not push a commit containing them. The release tags this
          # branch instead, and the notes name the upstream version and branches it was built from.
          flags=(--latest=false)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          {
            echo "Upstream [v$VERSION](https://github.com/$UPSTREAM/releases/tag/v$VERSION) with these fork branches applied: $(printf '\`%s\` ' $PATCH_BRANCHES)"
            echo
            echo 'Servers: set `T3CODE_RELEASE_BASE_URL=https://github.com/'"$GITHUB_REPOSITORY"'/releases/download` on the T3 Code service.'
            if ! ls assets/*.exe >/dev/null 2>&1; then
              echo
              echo '**No Windows installer:** the Windows build failed for this version.'
            fi
            if [ -s handoff/ai-notes.md ]; then
              echo
              echo '**The Cursor agent reconciled the patches with this upstream version.** Fold `ai-reconciliation.patch` into the patch branches so later builds apply cleanly.'
              echo
              cat handoff/ai-notes.md
            fi
          } > notes.md
          gh release create "$tag" assets/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "T3 Code $VERSION (patched)" --notes-file notes.md "${flags[@]}"

      - name: Prune older patched nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9.]+-nightly\.' | sort -V -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
