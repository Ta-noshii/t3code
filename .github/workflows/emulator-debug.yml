name: Emulator debug

on:
  push:
    branches: [emulator-debug]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$(cat .github/emulator/apk-tag)" -R "$GITHUB_REPOSITORY" -p t3code-nowbar.apk -O app.apk
      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          T3_DEBUG_TOKEN: ${{ secrets.T3_DEBUG_TOKEN }}
          T3_DEBUG_HOST: ${{ secrets.T3_DEBUG_HOST }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/emulator/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-out
          path: out/
          retention-days: 1
